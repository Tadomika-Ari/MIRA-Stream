name: Notify Plugin Authors for Issues

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue-number:
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  notify-plugin-authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instal PyGithub
        run: pip install -r .github/workflows/scripts/PyGithub-requirement.txt

      - name: Notify Authors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue-number || github.event.issue.number }}
        run: python .github/workflows/scripts/issues-notify-plugin-authors.py
