name: La Mira

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    environment: production
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.2'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
    
    - name: Create Binary
      run: go build -o mira-stream .
    
    # 3. Sauvegarde du binaire à la toute fin du workflow
    - name: Archivage du binaire (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: mira-stream-binary   # Le nom du dossier zip à télécharger sur GitHub
        path: mira-stream       # LE CHEMIN VERS VOTRE FICHIER BINAIRE GÉNÉRÉ
        retention-days: 14                  # Conservé pendant 7 jours avant suppression auto
  
